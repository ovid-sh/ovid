name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Linux x86-64 is the only target (#13), so only here do the tests run the
  # binaries they build: the corpus, prog's Ovid tests, and TestSelfHost.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...

  # Everything that does not execute an emitted binary must pass on a Mac too (#9).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -count=1 ./...
