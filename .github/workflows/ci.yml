name: ci

# Every push, on any branch, and pull requests from forks, whose pushes do
# not run here. A branch with an open PR runs twice; the runners are free.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux x86-64 is the only target (#13), so only here do the tests run the
  # binaries they build: the corpus, prog's Ovid tests, and TestSelfHost.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The toolchain itself must build on other hosts, even where the tests
      # cannot run there: platform-specific files are easy to tag too loosely.
      - run: |
          for t in linux/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./... || exit 1
          done
      # node runs the wasm corpus (TestCorpusWasm); OVID_WASM_NODE makes
      # the test fail rather than skip if node goes missing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test -count=1 ./...
        env:
          OVID_WASM_NODE: 1
      # Build time and size of the self-hosted compiler, kept with the run
      # (#11). A shared runner is noisy, so this is a record, not a check;
      # TestSelfHostSize is the check.
      - run: |
          go test ./internal/tool -run '^$' -bench 'Prog$' -benchtime 50x -count 3 | tee bench.txt
          { echo '```'; grep -E '^(cpu|Benchmark)' bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Everything that does not execute an emitted binary must pass on a Mac too (#9).
  # The wasm corpus runs here too: under node, Ovid output executes on a Mac.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test -count=1 ./...
        env:
          OVID_WASM_NODE: 1

  # The flake (#151): nix flake check on each system it builds here. On
  # Linux that includes a NixOS VM test, which needs KVM: install-nix-action
  # opens /dev/kvm to the runner user (enable_kvm, on by default) before it
  # installs Nix, and the features below let the VM test build.
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # It takes under 2 minutes. A VM that hangs at start (seen once: QEMU
    # never came up) would otherwise hold the runner for the test driver's
    # hour, or the job's six.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix flake check -L
