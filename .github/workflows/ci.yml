name: ci

# Every push, on any branch, and pull requests from forks, whose pushes do
# not run here. A branch with an open PR runs twice; the runners are free.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux x86-64 is the only target (#13), so only here do the tests run the
  # binaries they build: the corpus, prog's Ovid tests, and TestSelfHost.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The toolchain itself must build on other hosts, even where the tests
      # cannot run there: platform-specific files are easy to tag too loosely.
      - run: |
          for t in linux/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./... || exit 1
          done
      - run: go test -count=1 ./...

  # Everything that does not execute an emitted binary must pass on a Mac too (#9).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -count=1 ./...
